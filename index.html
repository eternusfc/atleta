<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atleta Eternus FC</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<aside class="side">
  <div class="brand">
    <img src="imagens/Logo.png" alt="" class="logo" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo-fallback',textContent:'OLP'}))">
    <div class="brand-t">ATLETA</div>
    <div class="brand-s">Eternus FC</div>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">
    <button class="btn ghost" id="btnExport">⬇ Exportar dados (JSON)</button>
    <button class="btn ghost" id="btnImport">⬆ Importar dados (JSON)</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
    <div class="muted sm center">Bora pra quadra. 🖤</div>
  </div>
</aside>
<main id="content"></main>
<div id="toast"></div>

<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/todo.js"></script>
<script src="js/pages/food.js"></script>
<script src="js/pages/train.js"></script>
<script src="js/pages/routine.js"></script>
<script src="js/pages/pantry.js"></script>
<script src="js/pages/progress.js"></script>
<script src="js/pages/profile.js"></script>
<script src="js/app.js"></script>
</body>
</html>
